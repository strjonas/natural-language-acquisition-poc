name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-ci.txt
      - name: Install
        run: |
          python -m pip install -c constraints-ci.txt -e '.[dev]'
          python -m pip check
          python -m pip freeze
      - name: Recalculate public result
        run: python scripts/summarize_probe63.py
      - name: Test
        run: python -m pytest -q
