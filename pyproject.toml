[project]
name = "homeostatic-social-grid"
version = "0.1.0"
description = "A minimal homeostatic social gridworld for grounded language and self-like agency experiments."
requires-python = ">=3.11"
dependencies = [
  "mlx",
  "numpy",
]

[project.scripts]
homegrid-demo = "homesocial.demo:main"
homegrid-experiment = "homesocial.experiment:main"
homegrid-recurrent = "homesocial.recurrent_ac:main"
homegrid-imitation = "homesocial.imitation:main"
homegrid-self-battery = "homesocial.self_battery:main"
homegrid-counterfactual = "homesocial.counterfactual:main"
homegrid-attribution = "homesocial.attribution:main"
homegrid-report = "homesocial.report_head:main"
homegrid-report-calibration = "homesocial.report_calibration:main"
homegrid-report-mediation = "homesocial.report_mediation:main"
homegrid-interoception = "homesocial.interoception:main"
homegrid-hidden-mediation = "homesocial.hidden_mediation:main"
homegrid-compositional-report = "homesocial.compositional_report:main"
homegrid-emergent-language = "homesocial.emergent_language:main"
homegrid-convention-transfer = "homesocial.convention_transfer:main"
homegrid-population-language = "homesocial.population_language:main"
homegrid-self-request-language = "homesocial.self_request_language:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homesocial"]
